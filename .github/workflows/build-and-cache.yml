name: Build and Cache

on:
  push:
    branches:
      - main
    paths:
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

jobs:
  build-and-cache:
    name: Build and cache Ardia
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - ardia
          - ardia-nightly
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build ${{ matrix.browser }}
        run: nix build .#${{ matrix.browser }} --print-build-logs --accept-flake-config
